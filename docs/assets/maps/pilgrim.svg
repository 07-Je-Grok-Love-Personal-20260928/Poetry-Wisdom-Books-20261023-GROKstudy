t" data-i="3" tabindex="0"><title>伯特利：中央山脊大道上的古城；北方朝圣者经此南下。</title><circle cx="355.8" cy="1014.1" r="11" style="fill:#ff9f43"/><text class="m-num" x="355.8" y="1018.3">3</text><text class="m-lab" x="342" y="1008" text-anchor="end">伯特利</text></g><g class="m-pt" data-i="4" tabindex="0"><title>示罗：会幕曾在此（书18:1；撒上1:3）：节期“上去”敬拜的古老传统。</title><circle cx="391.8" cy="935.8" r="11" style="fill:#b48cff"/><text class="m-num" x="391.8" y="940.0">4</text><text class="m-lab" x="406" y="936" text-anchor="start">示罗</text></g><g class="m-pt" data-i="5" tabindex="0"><title>示剑：以巴路山与基利心山之间；中央山脊大道北段。</title><circle cx="387.0" cy="836.9" r="11" style="fill:#5ab0ff"/><text class="m-num" x="387.0" y="841.1">5</text><text class="m-lab" x="401" y="841" text-anchor="start">示剑</text></g><g class="m-pt" data-i="6" tabindex="0"><title>黑门山：“又好比黑门的甘露降在锡安山”（诗133:3）：北方最高山的甘露，比喻弟兄和睦的祝福。</title><circle cx="691.9" cy="83.9" r="11" style="fill:#2fd3d3"/><text class="m-num" x="691.9" y="88.1">6</text><text class="m-lab" x="678" y="88" text-anchor="end">黑门山</text></g><g class="m-pt unc" data-i="7" tabindex="0"><title>南地（内盖夫）：“好像南地的河水复流”（诗126:4）：旱季干涸的河床，雨季忽然水流成河。</title><circle class="m-halo" cx="127.1" cy="1439.8" r="22" style="stroke:#ff6b6b"/><circle cx="127.1" cy="1439.8" r="11" style="fill:#ff6b6b"/><text class="m-num" x="127.1" y="1444.0">7</text><text class="m-lab" x="141" y="1444" text-anchor="start">南地（内盖夫）</text></g><g class="m-pt" data-i="8" tabindex="0"><title>伯利恒：大卫的家乡；南方朝圣者经此北上。</title><circle cx="344.1" cy="1154.9" r="11" style="fill:#ff7eb6"/><text class="m-num" x="344.1" y="1159.1">8</text><text class="m-lab" x="330" y="1165" text-anchor="end">伯利恒</text></g></svg>